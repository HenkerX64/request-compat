<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" role="img" aria-label="Your code and your dependencies call require('request'); package.json maps the name request to request-compat; request-compat answers with the API of request 2.88.2 and the security fixes"><title>Your code and your dependencies call require('request'); package.json maps the name request to request-compat; request-compat answers with the API of request 2.88.2 and the security fixes</title><rect width="880" height="252" rx="10" fill="#161b22"/><text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" font-weight="600">npm installs request-compat under the name request</text><rect x="16" y="48" width="240" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="32" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3" font-weight="600">Your code</text><text x="32" y="102" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c9d1d9">require('request')</text><rect x="16" y="136" width="240" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="32" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3" font-weight="600">A dependency</text><text x="32" y="190" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c9d1d9">require('request')</text><path d="M256 83 C286 83 286 112 308 112" fill="none" stroke="#c9d1d9" stroke-width="2"/><path d="M316 112 L306 106 V118 Z" fill="#c9d1d9"/><path d="M256 171 C286 171 286 142 308 142" fill="none" stroke="#c9d1d9" stroke-width="2"/><path d="M316 142 L306 136 V148 Z" fill="#c9d1d9"/><rect x="316" y="48" width="280" height="158" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="332" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3" font-weight="600">package.json</text><text x="332" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">alias or override</text><text x="332" y="130" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c9d1d9">"request":</text><text x="332" y="152" font-family="Consolas, Menlo, monospace" font-size="13" fill="#79c0ff">"npm:request-compat@^2.88.6"</text><text x="332" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">maps the name to the package</text><path d="M596 127 H660" stroke="#c9d1d9" stroke-width="2"/><path d="M668 127 L658 121 V133 Z" fill="#c9d1d9"/><text x="632" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">npm install</text><rect x="668" y="48" width="196" height="158" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><text x="684" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3" font-weight="600">request-compat</text><text x="684" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">API of request 2.88.2</text><text x="684" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">security holes closed</text><text x="684" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">Node 6 to 26</text><text x="684" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">original tests pass</text><text x="16" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">The require calls stay as they are, in your code and in node_modules.</text></svg>
